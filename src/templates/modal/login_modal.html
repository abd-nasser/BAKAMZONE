<!-- Modal de Connexion DaisyUI / HTMX / Alpine.js -->
<dialog id="login_modal" class="modal modal-bottom sm:modal-middle" x-data="{ showPassword: false }">
    <div class="modal-box bg-base-100 text-neutral rounded-3xl p-6 sm:p-8 shadow-2xl border border-base-300 relative">
        
        <!-- Bouton Fermer (Croix) -->
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-base-content/60 hover:text-base-content">✕</button>
        </form>

        <!-- En-tête Brand BAKAMZONE -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-50 text-[#059669] mb-3 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h3 class="font-extrabold text-2xl tracking-tight">
                <span class="text-[#059669]">BAKAM</span><span class="text-[#F97316]">ZONE</span>
            </h3>
            <p class="text-sm text-base-content/70 mt-1">Connectez-vous pour accéder à votre espace</p>
        </div>

        <!-- Zone d'affichage des retours HTMX (Succès / Erreur) -->
        <div id="login-result" class="mb-4"></div>

        <!-- Formulaire HTMX -->
        <form method="POST"
              action="{% url 'auth_app:connexion_htmx' %}"
              hx-post="{% url 'auth_app:connexion_htmx' %}"
              hx-target="#login-result"
              hx-swap="innerHTML"
              hx-indicator="#login-spinner"
              class="space-y-4">
            {% csrf_token %}

            <!-- Champ Identifiant (Téléphone ou Username) -->
            <div>
                <label class="label font-semibold text-xs tracking-wider uppercase text-base-content/70 py-1">
                    {{ connexion_form.identifiant.label }}
                </label>
                <div class="relative">
                    {{ connexion_form.identifiant }}
                    <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-base-content/40">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Champ Mot de passe avec toggle visibilité -->
            <div>
                <div class="flex justify-between items-center py-1">
                    <label class="label font-semibold text-xs tracking-wider uppercase text-base-content/70 p-0">
                        {{ connexion_form.password.label }}
                    </label>
                    <a href="#" class="text-xs text-[#059669] hover:underline">Oublié ?</a>
                </div>
                <div class="relative">
                    {{ connexion_form.password }}
                    <button type="button" 
                            @click="showPassword = !showPassword"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-base-content/40 hover:text-base-content focus:outline-none">
                        <!-- Œil ouvert -->
                        <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Œil barré -->
                        <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Bouton de Connexion -->
            <button type="submit"
                    class="btn w-full bg-[#059669] hover:bg-[#047857] text-white border-none rounded-xl font-bold shadow-md hover:shadow-lg transition-all h-12 mt-2">
                <span id="login-spinner" class="htmx-indicator loading loading-spinner loading-sm mr-2"></span>
                Se connecter
            </button>
        </form>

        <!-- Pied du modal -->
        <div class="mt-6 text-center text-xs text-base-content/70">
            <span>Vous n'avez pas encore de compte ?</span>
            <div class="mt-2 flex flex-wrap justify-center gap-3">
                <a href="#" class="font-bold text-[#059669] hover:underline">Créer compte Client</a>
                <span class="text-base-content/30">•</span>
                <a href="#" class="font-bold text-[#F97316] hover:underline">Devenir Partenaire</a>
            </div>
        </div>

    </div>

    <!-- Clic sur le fond pour fermer -->
    <form method="dialog" class="modal-backdrop">
        <button>fermer</button>
    </form>
</dialog>
