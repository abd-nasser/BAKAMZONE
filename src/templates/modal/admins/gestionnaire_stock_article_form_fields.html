{% for field in form %}
    <div class="form-control">
        <label class="label" for="{{ field.id_for_label }}">
            <span class="label-text font-semibold">{{ field.label }}</span>
        </label>
        {{ field }}
        {% for error in field.errors %}
            <span class="mt-1 text-sm text-error">{{ error }}</span>
        {% endfor %}
    </div>
{% endfor %}
