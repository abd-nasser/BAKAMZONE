<div id="commande-feedback">
    {% if message_commande %}
        <div class="toast toast-top toast-end z-50 pointer-events-none">
            <div class="alert alert-error pointer-events-auto rounded-2xl shadow-lg" role="alert" aria-live="assertive">
                <span>{{ message_commande }}</span>
            </div>
        </div>
    {% endif %}
    {% if form_commande.non_field_errors %}
        <div class="mt-3 space-y-1 text-sm text-error" role="alert">
            {% for error in form_commande.non_field_errors %}<p>{{ error }}</p>{% endfor %}
        </div>
    {% endif %}
    {% for field in form_commande %}
        {% for error in field.errors %}
            <p class="mt-1 text-sm text-error" role="alert">{{ error }}</p>
        {% endfor %}
    {% endfor %}
</div>
