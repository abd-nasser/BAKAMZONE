<div class="toast toast-top toast-end z-50" x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)">
  <div class="alert {% if succes %}alert-success{% else %}alert-error{% endif %} shadow-lg flex items-start gap-3">
    <div>
      <h3 class="font-bold text-sm">{{ title }}</h3>
      <div class="text-xs">{{ message }}</div>
    </div>
    <button type="button" class="btn btn-ghost btn-xs" @click="show = false">✕</button>
  </div>
</div>
