<div x-data="{ show: true }"
     x-show="show"
     x-init="setTimeout(() => show = false, 6000)"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-2 sm:translate-y-0 sm:translate-x-4"
     x-transition:enter-end="opacity-100 translate-y-0 sm:translate-x-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="alert {% if succes %}alert-success{% else %}alert-error{% endif %} shadow-xl text-sm rounded-2xl flex items-start justify-between gap-3 pointer-events-auto border border-base-300/40">
    <div class="flex items-start gap-2.5 min-w-0">
        <span class="text-lg leading-none shrink-0 mt-0.5">
            {% if succes %}✅{% else %}⚠️{% endif %}
        </span>
        <div class="min-w-0">
            {% if title %}
                <p class="font-black text-xs sm:text-sm leading-snug">{{ title }}</p>
            {% endif %}
            <p class="text-xs opacity-95 leading-relaxed mt-0.5 break-words">{{ message }}</p>
            {% if paiement and paiement.reference %}
                <p class="text-[11px] font-mono opacity-75 mt-1 truncate">
                    Réf. {{ paiement.reference }}
                </p>
            {% endif %}
        </div>
    </div>
    <button type="button"
            @click="show = false"
            aria-label="Fermer la notification"
            class="btn btn-xs btn-circle btn-ghost shrink-0">
        ✕
    </button>
</div>
