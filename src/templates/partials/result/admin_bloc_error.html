<div
    class="alert alert-error text-white rounded-xl shadow-lg py-3 px-4 mb-2 pointer-events-auto"
    x-data="{ show: true }"
    x-show="show"
    x-init="setTimeout(() => show = false, 7000)"
>
    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <div>
        <p class="font-bold">L’administrateur n’a pas pu être créé.</p>
        <ul class="text-xs list-disc list-inside">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    <button type="button" @click="show = false" class="btn btn-ghost btn-xs btn-circle">✕</button>
</div>
