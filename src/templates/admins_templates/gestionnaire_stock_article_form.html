{% extends "base.html" %}

{% block title %}Gestion d'article | BAKAMZONE{% endblock %}

{% block content %}
<main class="mx-auto max-w-3xl space-y-6 px-4 py-8 sm:px-6 lg:px-8">
    <div class="rounded-3xl border border-base-300 bg-base-100 p-6 shadow-md sm:p-8">
        <h1 class="text-2xl font-bold">{% if object %}Modifier l'article{% else %}Ajouter un article{% endif %}</h1>
        <p class="text-sm text-base-content/70 mt-1">Entreprise : {{ entreprise.nom_entreprise }}</p>

        <form method="post" enctype="multipart/form-data" class="mt-6 space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="flex justify-end gap-3 pt-4">
                <a href="{% url 'admins_app:entreprise-detail-stock' entreprise.pk %}" class="btn btn-ghost rounded-xl">Annuler</a>
                <button type="submit" class="btn bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl">Enregistrer</button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
